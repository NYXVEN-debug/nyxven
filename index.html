<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NYXVEN</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0d0d11;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    /* Müzik Çalar (Üst Sağ veya Sol Üst Yerleşimi) */
    .audio-control {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 18px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .audio-control span {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #ddd;
    }

    .audio-control input[type="range"] {
      accent-color: #a29bfe;
      cursor: pointer;
      width: 80px;
    }

    .play-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .play-btn:hover {
      transform: scale(1.15);
    }

    /* Ana Konteyner */
    .container {
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }

    /* Profil Kısmı */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 40px;
    }

    .avatar-container {
      position: relative;
      width: 130px;
      height: 130px;
      margin-bottom: 15px;
    }

    .avatar-container::before {
      content: '';
      position: absolute;
      top: -6px; left: -6px; right: -6px; bottom: -6px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.8) 0%, rgba(162, 155, 254, 0.5) 50%, transparent 70%);
      border-radius: 50%;
      filter: blur(10px);
      animation: glowPulse 3s ease-in-out infinite alternate;
    }

    @keyframes glowPulse {
      0% { opacity: 0.6; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1.05); }
    }

    .avatar {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.8);
      z-index: 2;
    }

    .username {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 5px;
      text-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    .bio {
      font-size: 14px;
      color: #8a8a9e;
      letter-spacing: 1px;
    }

    /* Sosyal İkonlar (Guns.lol Tarzı) */
    .social-links {
      display: flex;
      gap: 20px;
      margin-bottom: 50px;
    }

    .social-icon {
      color: #ffffff;
      font-size: 26px;
      transition: all 0.3s ease;
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.4));
    }

    .social-icon:hover {
      transform: translateY(-3px) scale(1.15);
      filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.9));
    }

    /* YouTube Videolar Alanı */
    .videos-section {
      width: 100%;
    }

    .section-title {
      font-size: 18px;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
      color: #c8c8d8;
      text-align: center;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 10px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .video-card {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.05);
      transition: transform 0.3s ease;
    }

    .video-card:hover {
      transform: translateY(-5px);
      border-color: rgba(255,255,255,0.2);
    }

    .video-card iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Arka Plan Müzik Çalar -->
  <div class="audio-control">
    <button class="play-btn" id="playBtn" onclick="togglePlay()">
      <i class="fas fa-play" id="playIcon"></i>
    </button>
    <span>Sadece Sevilmek İstedim</span>
    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.5" onchange="setVolume(this.value)" oninput="setVolume(this.value)">
  </div>

  <!-- Ses Dosyası (Sizin yüklediğiniz müzik) -->
  <audio id="bgMusic" loop>
    <source src="sadece-sevilmek-istedim.mp3" type="audio/mpeg">
  </audio>

  <div class="container">
    
    <!-- Profil Header -->
    <div class="hero">
      <div class="avatar-container">
        <img src="profile.png" alt="NYXVEN" class="avatar">
      </div>
      <h1 class="username">NYXVEN</h1>
      <p class="bio">Content Creator</p>
    </div>

    <!-- Guns.lol Tarzı İkonlar -->
    <div class="social-links">
      <a href="https://youtube.com" target="_blank" class="social-icon"><i class="fab fa-youtube"></i></a>
      <a href="https://tiktok.com" target="_blank" class="social-icon"><i class="fab fa-tiktok"></i></a>
      <a href="https://steamcommunity.com" target="_blank" class="social-icon"><i class="fab fa-steam"></i></a>
      <a href="https://spotify.com" target="_blank" class="social-icon"><i class="fab fa-spotify"></i></a>
    </div>

    <!-- YouTube Son 3 Video Alanı -->
    <div class="videos-section">
      <h2 class="section-title">Son Videolar</h2>
      <div class="video-grid">
        
        <!-- Video 1 -->
        <div class="video-card">
          <iframe src="https://www.youtube.com/embed/VIDEO_ID_1" allowfullscreen></iframe>
        </div>

        <!-- Video 2 -->
        <div class="video-card">
          <iframe src="https://www.youtube.com/embed/VIDEO_ID_2" allowfullscreen></iframe>
        </div>

        <!-- Video 3 -->
        <div class="video-card">
          <iframe src="https://www.youtube.com/embed/VIDEO_ID_3" allowfullscreen></iframe>
        </div>

      </div>
    </div>

  </div>

  <script>
    const music = document.getElementById("bgMusic");
    const playIcon = document.getElementById("playIcon");

    // Sayfa yüklendiğinde ses seviyesini ayarla
    music.volume = 0.5;

    function togglePlay() {
      if (music.paused) {
        music.play();
        playIcon.className = "fas fa-pause";
      } else {
        music.pause();
        playIcon.className = "fas fa-play";
      }
    }

    function setVolume(val) {
      music.volume = val;
    }
  </script>
</body>
</html>
