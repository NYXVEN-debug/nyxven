<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NYXVEN</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0d0d11;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    /* Müzik Çalar (Sağ Üst) */
    .audio-control {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 18px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .audio-control span {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #ddd;
    }

    .audio-control input[type="range"] {
      accent-color: #a29bfe;
      cursor: pointer;
      width: 80px;
    }

    .play-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .play-btn:hover {
      transform: scale(1.15);
    }

    /* Ana Konteyner */
    .container {
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 40px;
    }

    /* Profil Kısmı */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 30px;
    }

    .avatar-container {
      position: relative;
      width: 130px;
      height: 130px;
      margin-bottom: 15px;
    }

    .avatar-container::before {
      content: '';
      position: absolute;
      top: -6px; left: -6px; right: -6px; bottom: -6px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.8) 0%, rgba(162, 155, 254, 0.5) 50%, transparent 70%);
      border-radius: 50%;
      filter: blur(10px);
      animation: glowPulse 3s ease-in-out infinite alternate;
    }

    @keyframes glowPulse {
      0% { opacity: 0.6; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1.05); }
    }

    .avatar {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.8);
      z-index: 2;
    }

    .username {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 5px;
      text-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    .bio {
      font-size: 14px;
      color: #8a8a9e;
      letter-spacing: 1px;
    }

    /* Navigasyon / Sekme Butonları */
    .nav-buttons {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 10px 24px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }

    /* Kanallarım (Sosyal İkonlar) */
    .social-links {
      display: flex;
      gap: 25px;
      margin-top: 10px;
    }

    .social-icon {
      color: #ffffff;
      font-size: 28px;
      transition: all 0.3s ease;
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.4));
    }

    .social-icon:hover {
      transform: translateY(-3px) scale(1.15);
      filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.9));
    }

    /* Videolarım Penceresi (Modal Pop-up) */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-content {
      background: #13131a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
      max-width: 900px;
      max-height: 85vh;
      border-radius: 16px;
      padding: 25px;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 12px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .close-btn {
      background: none;
      border: none;
      color: #aaa;
      font-size: 22px;
      cursor: pointer;
      transition: color 0.2s;
    }

    .close-btn:hover {
      color: #fff;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .video-card {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .video-card iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }

    .loading-text {
      text-align: center;
      color: #8a8a9e;
      padding: 30px;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <!-- Arka Plan Müzik Çalar -->
  <div class="audio-control">
    <button class="play-btn" id="playBtn" onclick="togglePlay()">
      <i class="fas fa-play" id="playIcon"></i>
    </button>
    <span>Sadece Sevilmek İstedim</span>
    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.5" onchange="setVolume(this.value)" oninput="setVolume(this.value)">
  </div>

  <audio id="bgMusic" loop>
    <source src="sadece-sevilmek-istedim.mp3" type="audio/mpeg">
  </audio>

  <div class="container">
    
    <!-- Profil Header -->
    <div class="hero">
      <div class="avatar-container">
        <img src="profile.png" alt="NYXVEN" class="avatar">
      </div>
      <h1 class="username">NYXVEN</h1>
      <p class="bio">Content Creator</p>
    </div>

    <!-- Navigasyon Sekmeleri -->
    <div class="nav-buttons">
      <button class="nav-btn" onclick="openVideosModal()"><i class="fab fa-youtube"></i> Videolarım</button>
    </div>

    <!-- Kanallarım (Guns.lol Tarzı İkonlar) -->
    <div class="social-links">
      <a href="https://www.youtube.com/channel/UCM6EXLZFrqGu5Yd0gf1PCpg" target="_blank" class="social-icon" title="YouTube"><i class="fab fa-youtube"></i></a>
      <a href="https://tiktok.com" target="_blank" class="social-icon" title="TikTok"><i class="fab fa-tiktok"></i></a>
      <a href="https://steamcommunity.com" target="_blank" class="social-icon" title="Steam"><i class="fab fa-steam"></i></a>
      <a href="https://spotify.com" target="_blank" class="social-icon" title="Spotify"><i class="fab fa-spotify"></i></a>
    </div>

  </div>

  <!-- Videolarım Penceresi -->
  <div class="modal-overlay" id="videosModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title"><i class="fab fa-youtube"></i> Tüm Videolarım</h2>
        <button class="close-btn" onclick="closeVideosModal()"><i class="fas fa-times"></i></button>
      </div>
      <div class="video-grid" id="videoContainer">
        <div class="loading-text">Videolar yükleniyor...</div>
      </div>
    </div>
  </div>

  <script>
    // Müzik Kontrolleri
    const music = document.getElementById("bgMusic");
    const playIcon = document.getElementById("playIcon");
    music.volume = 0.5;

    function togglePlay() {
      if (music.paused) {
        music.play();
        playIcon.className = "fas fa-pause";
      } else {
        music.pause();
        playIcon.className = "fas fa-play";
      }
    }

    function setVolume(val) {
      music.volume = val;
    }

    // YouTube Videolarını RSS Akışından Otomatik Çekme
    const CHANNEL_ID = 'UCM6EXLZFrqGu5Yd0gf1PCpg';
    const rssUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${CHANNEL_ID}`;
    const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

    let videosLoaded = false;

    function openVideosModal() {
      document.getElementById('videosModal').style.display = 'flex';
      if (!videosLoaded) {
        fetchYouTubeVideos();
      }
    }

    function closeVideosModal() {
      document.getElementById('videosModal').style.display = 'none';
    }

    // Modal Dışına Tıklayınca Kapatma
    window.onclick = function(event) {
      const modal = document.getElementById('videosModal');
      if (event.target == modal) {
        closeVideosModal();
      }
    }

    function fetchYouTubeVideos() {
      fetch(apiUrl)
        .then(response => response.json())
        .then(data => {
          const container = document.getElementById('videoContainer');
          container.innerHTML = '';

          if (data.status === 'ok' && data.items.length > 0) {
            data.items.forEach(item => {
              // Video ID çıkarma
              const videoId = item.link.split('v=')[1];
              if (videoId) {
                const videoCard = document.createElement('div');
                videoCard.className = 'video-card';
                videoCard.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>`;
                container.appendChild(videoCard);
              }
            });
            videosLoaded = true;
          } else {
            container.innerHTML = '<div class="loading-text">Henüz video bulunamadı veya bir hata oluştu.</div>';
          }
        })
        .catch(error => {
          console.error('Video çekme hatası:', error);
          document.getElementById('videoContainer').innerHTML = '<div class="loading-text">Videolar yüklenirken bir hata oluştu.</div>';
        });
    }
  </script>
</body>
</html>
